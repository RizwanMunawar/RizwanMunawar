<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" fill="none" role="img" aria-label="Real-time computer vision banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#121c38"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DD00BA"/>
      <stop offset="0.55" stop-color="#7C4DFF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E0FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E0FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#00E0FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="860" height="260" rx="18" fill="url(#bg)"/>

  <!-- faint tech grid -->
  <g stroke="#3350a0" stroke-width="1" opacity="0.10">
    <line x1="43" y1="0" x2="43" y2="260"/><line x1="129" y1="0" x2="129" y2="260"/>
    <line x1="215" y1="0" x2="215" y2="260"/><line x1="301" y1="0" x2="301" y2="260"/>
    <line x1="387" y1="0" x2="387" y2="260"/><line x1="473" y1="0" x2="473" y2="260"/>
    <line x1="559" y1="0" x2="559" y2="260"/><line x1="645" y1="0" x2="645" y2="260"/>
    <line x1="731" y1="0" x2="731" y2="260"/><line x1="817" y1="0" x2="817" y2="260"/>
    <line x1="0" y1="112" x2="860" y2="112"/><line x1="0" y1="152" x2="860" y2="152"/>
    <line x1="0" y1="192" x2="860" y2="192"/><line x1="0" y1="232" x2="860" y2="232"/>
  </g>

  <!-- title -->
  <text x="430" y="52" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="30" font-weight="700" fill="url(#txt)">
    Muhammad Rizwan Munawar
    <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- cycling role text -->
  <g font-family="'Fira Code','Courier New',monospace" font-size="17" font-weight="600" fill="#79E7FF" text-anchor="middle">
    <text x="430" y="86" opacity="0">Object Detection<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0;0.01;0.19;0.2;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="430" y="86" opacity="0">Instance Segmentation<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.21;0.39;0.4;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="430" y="86" opacity="0">Object Tracking<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.41;0.59;0.6;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="430" y="86" opacity="0">Pose Estimation<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.61;0.79;0.8;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="430" y="86" opacity="0">Edge AI &amp; Vision Language Models<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.81;0.99;1;1" dur="12s" repeatCount="indefinite"/></text>
  </g>

  <!-- detection boxes -->
  <!-- box 1 : person -->
  <g>
    <rect x="86" y="140" width="150" height="86" rx="4" fill="none" stroke="#DD00BA" stroke-width="2.5" stroke-dasharray="472" stroke-dashoffset="472">
      <animate attributeName="stroke-dashoffset" values="472;0;0;472" keyTimes="0;0.35;0.85;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.35;0.85;1" dur="4s" repeatCount="indefinite"/>
      <rect x="86" y="124" width="92" height="16" rx="3" fill="#DD00BA"/>
      <text x="92" y="136" font-family="'Fira Code',monospace" font-size="11" fill="#ffffff">person 0.98</text>
    </g>
  </g>
  <!-- box 2 : car -->
  <g>
    <rect x="372" y="128" width="126" height="104" rx="4" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="460" stroke-dashoffset="460">
      <animate attributeName="stroke-dashoffset" values="460;0;0;460" keyTimes="0;0.35;0.85;1" dur="4s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.35;0.85;1" dur="4s" begin="0.5s" repeatCount="indefinite"/>
      <rect x="372" y="112" width="62" height="16" rx="3" fill="#3B82F6"/>
      <text x="378" y="124" font-family="'Fira Code',monospace" font-size="11" fill="#ffffff">car 0.95</text>
    </g>
  </g>
  <!-- box 3 : bicycle -->
  <g>
    <rect x="648" y="150" width="150" height="78" rx="4" fill="none" stroke="#00E0FF" stroke-width="2.5" stroke-dasharray="456" stroke-dashoffset="456">
      <animate attributeName="stroke-dashoffset" values="456;0;0;456" keyTimes="0;0.35;0.85;1" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.35;0.85;1" dur="4s" begin="1s" repeatCount="indefinite"/>
      <rect x="648" y="134" width="86" height="16" rx="3" fill="#00E0FF"/>
      <text x="654" y="146" font-family="'Fira Code',monospace" font-size="11" fill="#062033">bicycle 0.92</text>
    </g>
  </g>

  <!-- sweeping scan line -->
  <rect x="0" y="104" width="2.5" height="132" fill="url(#scan)" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="60 0; 800 0; 60 0" keyTimes="0;0.5;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets -->
  <g stroke="#DD00BA" stroke-width="2.5" fill="none">
    <path d="M18 40 L18 22 L36 22"/>
    <path d="M842 40 L842 22 L824 22"/>
    <path d="M18 220 L18 238 L36 238"/>
    <path d="M842 220 L842 238 L824 238"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </g>
</svg>
