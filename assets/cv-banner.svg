<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" fill="none" role="img" aria-label="Real-time computer vision, delivered end to end across edge AI, embedded devices and desktop apps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3fc"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DD00BA"/>
      <stop offset="0.55" stop-color="#7C4DFF"/>
      <stop offset="1" stop-color="#1E6BFF"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E6BFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1E6BFF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#1E6BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="depthg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde725"/>
      <stop offset="0.35" stop-color="#35b779"/>
      <stop offset="0.7" stop-color="#31688e"/>
      <stop offset="1" stop-color="#440154"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="860" height="300" rx="18" fill="url(#bg)"/>

  <!-- faint tech grid -->
  <g stroke="#cdd8f0" stroke-width="1" opacity="0.6">
    <line x1="43" y1="0" x2="43" y2="300"/><line x1="129" y1="0" x2="129" y2="300"/>
    <line x1="215" y1="0" x2="215" y2="300"/><line x1="301" y1="0" x2="301" y2="300"/>
    <line x1="387" y1="0" x2="387" y2="300"/><line x1="473" y1="0" x2="473" y2="300"/>
    <line x1="559" y1="0" x2="559" y2="300"/><line x1="645" y1="0" x2="645" y2="300"/>
    <line x1="731" y1="0" x2="731" y2="300"/><line x1="817" y1="0" x2="817" y2="300"/>
    <line x1="0" y1="112" x2="860" y2="112"/><line x1="0" y1="152" x2="860" y2="152"/>
    <line x1="0" y1="192" x2="860" y2="192"/><line x1="0" y1="232" x2="860" y2="232"/>
  </g>

  <!-- title -->
  <text x="430" y="46" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="29" font-weight="700" fill="url(#txt)">
    Muhammad Rizwan Munawar
    <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- cycling task label -->
  <g font-family="'Fira Code','Courier New',monospace" font-size="17" font-weight="700" fill="#12245a" text-anchor="middle">
    <text x="430" y="78" opacity="1">Object Detection<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.1587;0.1667;0.992;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="430" y="78" opacity="0">Oriented Bounding Boxes (OBB)<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1667;0.1747;0.3253;0.3333;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="430" y="78" opacity="0">Instance Segmentation<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3413;0.492;0.5;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="430" y="78" opacity="0">Object Tracking<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.508;0.6587;0.6667;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="430" y="78" opacity="0">Pose Estimation<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.6747;0.8253;0.8333;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="430" y="78" opacity="0">Depth Estimation<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8333;0.8413;0.992;1;1" dur="18s" repeatCount="indefinite"/></text>
  </g>

  <!-- ===== STAGE 1 : DETECTION ===== -->
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.1587;0.1667;0.992;1" dur="18s" repeatCount="indefinite"/>
    <rect x="300" y="112" width="120" height="116" rx="4" fill="none" stroke="#DD00BA" stroke-width="2.5"/>
    <rect x="300" y="96" width="98" height="16" rx="3" fill="#DD00BA"/>
    <text x="306" y="108" font-family="'Fira Code',monospace" font-size="11" fill="#ffffff">person 0.98</text>
    <rect x="520" y="148" width="210" height="80" rx="4" fill="none" stroke="#1E6BFF" stroke-width="2.5"/>
    <rect x="520" y="132" width="66" height="16" rx="3" fill="#1E6BFF"/>
    <text x="526" y="144" font-family="'Fira Code',monospace" font-size="11" fill="#ffffff">car 0.96</text>
  </g>

  <!-- ===== STAGE 2 : ORIENTED BOUNDING BOXES ===== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1667;0.1747;0.3253;0.3333;1" dur="18s" repeatCount="indefinite"/>
    <g transform="rotate(28 372 168)">
      <rect x="300" y="150" width="144" height="40" rx="3" fill="none" stroke="#DD00BA" stroke-width="2.5"/>
      <line x1="444" y1="170" x2="462" y2="170" stroke="#DD00BA" stroke-width="2.5"/>
    </g>
    <rect x="300" y="98" width="96" height="16" rx="3" fill="#DD00BA"/>
    <text x="306" y="110" font-family="'Fira Code',monospace" font-size="11" fill="#ffffff">ship 0.94 · 28°</text>
    <g transform="rotate(-22 626 176)">
      <rect x="560" y="150" width="132" height="52" rx="3" fill="none" stroke="#1E6BFF" stroke-width="2.5"/>
      <line x1="692" y1="176" x2="710" y2="176" stroke="#1E6BFF" stroke-width="2.5"/>
    </g>
    <rect x="560" y="120" width="104" height="16" rx="3" fill="#1E6BFF"/>
    <text x="566" y="132" font-family="'Fira Code',monospace" font-size="11" fill="#ffffff">plane 0.91 · -22°</text>
  </g>

  <!-- ===== STAGE 3 : SEGMENTATION ===== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3413;0.492;0.5;1" dur="18s" repeatCount="indefinite"/>
    <circle cx="360" cy="138" r="18" fill="#DD00BA" fill-opacity="0.5" stroke="#DD00BA" stroke-width="2"/>
    <path d="M328 228 Q328 166 360 164 Q392 166 392 228 Z" fill="#DD00BA" fill-opacity="0.45" stroke="#DD00BA" stroke-width="2"/>
    <rect x="326" y="96" width="94" height="16" rx="3" fill="#DD00BA"/>
    <text x="332" y="108" font-family="'Fira Code',monospace" font-size="11" fill="#ffffff">mask person</text>
    <path d="M524 226 Q520 192 560 188 L600 164 Q650 158 690 186 Q726 190 726 226 Z" fill="#1E6BFF" fill-opacity="0.42" stroke="#1E6BFF" stroke-width="2"/>
    <circle cx="576" cy="226" r="12" fill="#1E6BFF" fill-opacity="0.7"/>
    <circle cx="686" cy="226" r="12" fill="#1E6BFF" fill-opacity="0.7"/>
    <rect x="524" y="142" width="70" height="16" rx="3" fill="#1E6BFF"/>
    <text x="530" y="154" font-family="'Fira Code',monospace" font-size="11" fill="#ffffff">mask car</text>
  </g>

  <!-- ===== STAGE 4 : TRACKING ===== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.508;0.6587;0.6667;1" dur="18s" repeatCount="indefinite"/>
    <rect x="196" y="116" width="112" height="114" rx="4" fill="none" stroke="#7C4DFF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>
    <rect x="262" y="114" width="114" height="116" rx="4" fill="none" stroke="#7C4DFF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.55"/>
    <path d="M252 174 L318 172 L392 170" fill="none" stroke="#7C4DFF" stroke-width="1.5" stroke-dasharray="2 5"/>
    <rect x="336" y="112" width="118" height="118" rx="4" fill="none" stroke="#7C4DFF" stroke-width="2.5"/>
    <rect x="336" y="96" width="80" height="16" rx="3" fill="#7C4DFF"/>
    <text x="342" y="108" font-family="'Fira Code',monospace" font-size="11" fill="#ffffff">ID 3 · car</text>
    <rect x="560" y="148" width="180" height="80" rx="4" fill="none" stroke="#00B894" stroke-width="2.5"/>
    <rect x="560" y="132" width="52" height="16" rx="3" fill="#00B894"/>
    <text x="566" y="144" font-family="'Fira Code',monospace" font-size="11" fill="#ffffff">ID 7</text>
  </g>

  <!-- ===== STAGE 5 : POSE ===== -->
  <g opacity="0" stroke-linecap="round">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.6747;0.8253;0.8333;1" dur="18s" repeatCount="indefinite"/>
    <g stroke="#1E6BFF" stroke-width="3" fill="none">
      <path d="M410 128 L410 148"/>
      <path d="M384 152 L436 152"/>
      <path d="M384 152 L372 186 L368 212"/>
      <path d="M436 152 L448 186 L452 212"/>
      <path d="M398 194 L422 194"/>
      <path d="M398 194 L392 228"/>
      <path d="M422 194 L428 228"/>
      <path d="M410 148 L410 194"/>
    </g>
    <g fill="#DD00BA">
      <circle cx="410" cy="124" r="8" fill="none" stroke="#DD00BA" stroke-width="3"/>
      <circle cx="384" cy="152" r="3.5"/><circle cx="436" cy="152" r="3.5"/>
      <circle cx="372" cy="186" r="3.5"/><circle cx="448" cy="186" r="3.5"/>
      <circle cx="368" cy="212" r="3.5"/><circle cx="452" cy="212" r="3.5"/>
      <circle cx="398" cy="194" r="3.5"/><circle cx="422" cy="194" r="3.5"/>
      <circle cx="392" cy="228" r="3.5"/><circle cx="428" cy="228" r="3.5"/>
    </g>
    <rect x="368" y="96" width="92" height="16" rx="3" fill="#1E6BFF"/>
    <text x="374" y="108" font-family="'Fira Code',monospace" font-size="11" fill="#ffffff">pose · 17 kpts</text>
  </g>

  <!-- ===== STAGE 6 : DEPTH ===== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8333;0.8413;0.992;1;1" dur="18s" repeatCount="indefinite"/>
    <rect x="150" y="100" width="560" height="128" rx="10" fill="url(#depthg)" opacity="0.9"/>
    <path d="M250 228 Q250 162 288 160 Q326 162 326 228 Z" fill="#fdf6b2" opacity="0.85"/>
    <rect x="520" y="168" width="150" height="56" rx="12" fill="#3b1a5a" opacity="0.85"/>
    <rect x="150" y="100" width="560" height="128" rx="10" fill="none" stroke="#12245a" stroke-width="1.5" opacity="0.4"/>
    <rect x="182" y="112" width="88" height="16" rx="3" fill="#12245a"/>
    <text x="188" y="124" font-family="'Fira Code',monospace" font-size="11" fill="#ffffff">depth map</text>
    <text x="168" y="220" font-family="'Fira Code',monospace" font-size="11" font-weight="700" fill="#12245a">near</text>
    <text x="662" y="220" font-family="'Fira Code',monospace" font-size="11" font-weight="700" fill="#ffffff">far</text>
  </g>

  <!-- sweeping scan line (over the scene) -->
  <rect x="0" y="92" width="2.5" height="140" fill="url(#scan)" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="60 0; 800 0; 60 0" keyTimes="0;0.5;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== END-TO-END DELIVERY BAND (always on) ===== -->
  <line x1="40" y1="248" x2="820" y2="248" stroke="#cdd8f0" stroke-width="1"/>
  <g font-family="'Fira Code','Courier New',monospace">
    <text x="60" y="277" font-size="14" font-weight="700" fill="#12245a">End-to-end delivery, not just demos</text>
    <path d="M356 272 L378 272 M372 267 L378 272 L372 277" stroke="#7C4DFF" stroke-width="2" fill="none"/>
    <!-- Edge AI -->
    <g>
      <rect x="392" y="262" width="86" height="22" rx="11" fill="#ffffff" stroke="#cdd8f0" stroke-width="1.5"/>
      <circle cx="405" cy="273" r="4" fill="#cdd8f0"><animate attributeName="fill" values="#00C853;#00C853;#cdd8f0;#cdd8f0;#00C853" keyTimes="0;0.31;0.34;0.98;1" dur="6s" repeatCount="indefinite"/></circle>
      <text x="416" y="277" font-size="12" font-weight="600" fill="#12245a">Edge AI</text>
    </g>
    <!-- Embedded Devices -->
    <g>
      <rect x="488" y="262" width="150" height="22" rx="11" fill="#ffffff" stroke="#cdd8f0" stroke-width="1.5"/>
      <circle cx="501" cy="273" r="4" fill="#cdd8f0"><animate attributeName="fill" values="#cdd8f0;#cdd8f0;#00C853;#00C853;#cdd8f0;#cdd8f0" keyTimes="0;0.333;0.353;0.647;0.667;1" dur="6s" repeatCount="indefinite"/></circle>
      <text x="512" y="277" font-size="12" font-weight="600" fill="#12245a">Embedded Devices</text>
    </g>
    <!-- Desktop Apps -->
    <g>
      <rect x="648" y="262" width="120" height="22" rx="11" fill="#ffffff" stroke="#cdd8f0" stroke-width="1.5"/>
      <circle cx="661" cy="273" r="4" fill="#cdd8f0"><animate attributeName="fill" values="#cdd8f0;#cdd8f0;#00C853;#00C853;#cdd8f0" keyTimes="0;0.667;0.687;0.98;1" dur="6s" repeatCount="indefinite"/></circle>
      <text x="672" y="277" font-size="12" font-weight="600" fill="#12245a">Desktop Apps</text>
    </g>
  </g>

  <!-- corner brackets -->
  <g stroke="#DD00BA" stroke-width="2.5" fill="none">
    <path d="M18 40 L18 22 L36 22"/>
    <path d="M842 40 L842 22 L824 22"/>
    <path d="M18 260 L18 278 L36 278"/>
    <path d="M842 260 L842 278 L824 278"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </g>
</svg>
