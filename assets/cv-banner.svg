<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" fill="none" font-family="'Helvetica Neue',Arial,'Segoe UI',sans-serif" role="img" aria-label="Real-time computer vision — detection, segmentation, tracking, pose, depth and OBB, delivered end to end across edge AI, embedded devices and desktop apps">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f9"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="depthg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde725"/>
      <stop offset="0.4" stop-color="#35b779"/>
      <stop offset="0.72" stop-color="#31688e"/>
      <stop offset="1" stop-color="#440154"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#DD00BA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#DD00BA" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screenclip"><rect x="352" y="40" width="506" height="228" rx="14"/></clipPath>
    <g id="person">
      <circle cx="470" cy="112" r="15"/>
      <rect x="452" y="130" width="36" height="62" rx="14"/>
      <rect x="439" y="134" width="10" height="50" rx="5"/>
      <rect x="491" y="134" width="10" height="50" rx="5"/>
      <rect x="455" y="188" width="12" height="60" rx="6"/>
      <rect x="473" y="188" width="12" height="60" rx="6"/>
    </g>
    <g id="car">
      <path d="M586,250 L586,216 Q586,202 602,200 L624,178 Q632,170 646,170 L700,170 Q714,170 720,182 L732,202 L742,204 Q754,207 754,219 L754,250 Z"/>
      <circle cx="624" cy="250" r="15"/>
      <circle cx="716" cy="250" r="15"/>
    </g>
  </defs>

  <rect x="0" y="0" width="900" height="320" rx="20" fill="url(#page)"/>
  <ellipse cx="150" cy="70" rx="240" ry="150" fill="url(#halo)"/>

  <!-- ===================== LEFT : capability tags ===================== -->
  <g font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">
    <g>
      <rect x="44" y="66" width="132" height="24" rx="12" fill="#ffffff" stroke="#dbe3ef"/>
      <text x="110" y="82">Detection</text>
    </g>
    <g>
      <rect x="188" y="66" width="132" height="24" rx="12" fill="#ffffff" stroke="#dbe3ef"/>
      <text x="254" y="82">Segmentation</text>
    </g>
    <g>
      <rect x="44" y="98" width="132" height="24" rx="12" fill="#ffffff" stroke="#dbe3ef"/>
      <text x="110" y="114">Tracking</text>
    </g>
    <g>
      <rect x="188" y="98" width="132" height="24" rx="12" fill="#ffffff" stroke="#dbe3ef"/>
      <text x="254" y="114">Pose Estimation</text>
    </g>
    <g>
      <rect x="44" y="130" width="132" height="24" rx="12" fill="#ffffff" stroke="#dbe3ef"/>
      <text x="110" y="146">Depth</text>
    </g>
    <g>
      <rect x="188" y="130" width="132" height="24" rx="12" fill="#ffffff" stroke="#dbe3ef"/>
      <text x="254" y="146">Oriented Boxes</text>
    </g>
    <g>
      <rect x="44" y="162" width="132" height="24" rx="12" fill="#ffffff" stroke="#dbe3ef"/>
      <text x="110" y="178">Object Counting</text>
    </g>
    <g>
      <rect x="188" y="162" width="132" height="24" rx="12" fill="#ffffff" stroke="#dbe3ef"/>
      <text x="254" y="178">Classification</text>
    </g>
  </g>

  <!-- ===================== RIGHT : camera viewport ===================== -->
  <rect x="352" y="40" width="506" height="228" rx="14" fill="url(#screen)"/>
  <g clip-path="url(#screenclip)">
    <!-- scene backdrop -->
    <rect x="352" y="200" width="506" height="68" fill="#16223b" opacity="0.6"/>
    <line x1="352" y1="200" x2="858" y2="200" stroke="#2a3a5c" stroke-width="1" opacity="0.7"/>

    <!-- base subjects -->
    <use href="#person" fill="#8ea3c4"/>
    <use href="#car" fill="#8ea3c4"/>
    <circle cx="624" cy="250" r="6" fill="#0b1220"/>
    <circle cx="716" cy="250" r="6" fill="#0b1220"/>

    <!-- STAGE 1 : DETECTION -->
    <g opacity="1">
      <g stroke="#DD00BA" stroke-width="2.4" fill="none" stroke-linecap="round">
        <path d="M432 108 L432 94 L446 94"/><path d="M494 94 L508 94 L508 108"/>
        <path d="M432 240 L432 254 L446 254"/><path d="M494 254 L508 254 L508 240"/>
      </g>
      <rect x="432" y="76" width="86" height="16" rx="3" fill="#DD00BA"/>
      <text x="438" y="88" font-size="10.5" font-weight="600" fill="#fff">person 0.98</text>
      <g stroke="#38BDF8" stroke-width="2.4" fill="none" stroke-linecap="round">
        <path d="M586 176 L586 162 L600 162"/><path d="M742 162 L756 162 L756 176"/>
        <path d="M586 244 L586 258 L600 258"/><path d="M742 258 L756 258 L756 244"/>
      </g>
      <rect x="586" y="144" width="60" height="16" rx="3" fill="#38BDF8"/>
      <text x="592" y="156" font-size="10.5" font-weight="600" fill="#04263a">car 0.96</text>
    </g>

    <!-- STAGE 2 : OBB -->
    <g opacity="0">
      <g transform="rotate(9 470 172)" stroke="#DD00BA" stroke-width="2.4" fill="none">
        <rect x="434" y="96" width="72" height="152" rx="2"/>
        <line x1="470" y1="96" x2="470" y2="82"/>
      </g>
      <rect x="430" y="70" width="96" height="16" rx="3" fill="#DD00BA"/>
      <text x="436" y="82" font-size="10.5" font-weight="600" fill="#fff">person · 9°</text>
      <g transform="rotate(-8 670 210)" stroke="#38BDF8" stroke-width="2.4" fill="none">
        <rect x="586" y="164" width="168" height="92" rx="2"/>
        <line x1="670" y1="164" x2="670" y2="150"/>
      </g>
      <rect x="586" y="140" width="66" height="16" rx="3" fill="#38BDF8"/>
      <text x="592" y="152" font-size="10.5" font-weight="600" fill="#04263a">car · -8°</text>
    </g>

    <!-- STAGE 3 : SEGMENTATION -->
    <g opacity="0">
      <use href="#person" fill="#DD00BA" fill-opacity="0.55"/>
      <use href="#car" fill="#38BDF8" fill-opacity="0.5"/>
      <rect x="432" y="80" width="92" height="16" rx="3" fill="#DD00BA"/>
      <text x="438" y="92" font-size="10.5" font-weight="600" fill="#fff">mask person</text>
      <rect x="586" y="146" width="72" height="16" rx="3" fill="#38BDF8"/>
      <text x="592" y="158" font-size="10.5" font-weight="600" fill="#04263a">mask car</text>
    </g>

    <!-- STAGE 4 : TRACKING -->
    <g opacity="0" fill="none">
      <rect x="392" y="98" width="72" height="152" rx="2" stroke="#7C5CFC" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.35"/>
      <rect x="414" y="96" width="74" height="154" rx="2" stroke="#7C5CFC" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.6"/>
      <path d="M430 176 L456 174 L484 172" stroke="#7C5CFC" stroke-width="1.5" stroke-dasharray="2 5"/>
      <rect x="432" y="94" width="76" height="158" rx="2" stroke="#7C5CFC" stroke-width="2.4"/>
      <rect x="432" y="76" width="66" height="16" rx="3" fill="#7C5CFC" stroke="none"/>
      <text x="438" y="88" font-size="10.5" font-weight="600" fill="#fff">ID 3 · car</text>
      <rect x="586" y="162" width="170" height="94" rx="2" stroke="#34D399" stroke-width="2.4"/>
      <rect x="586" y="144" width="48" height="16" rx="3" fill="#34D399" stroke="none"/>
      <text x="592" y="156" font-size="10.5" font-weight="600" fill="#053a29">ID 7</text>
    </g>

    <!-- STAGE 5 : POSE -->
    <g opacity="0" stroke-linecap="round">
      <g stroke="#38BDF8" stroke-width="3" fill="none">
        <path d="M470 127 L470 150"/>
        <path d="M444 152 L496 152"/>
        <path d="M444 152 L432 186 L428 214"/>
        <path d="M496 152 L508 186 L512 214"/>
        <path d="M458 196 L482 196"/>
        <path d="M458 196 L452 234"/>
        <path d="M482 196 L488 234"/>
        <path d="M470 150 L470 196"/>
      </g>
      <g fill="#DD00BA">
        <circle cx="470" cy="120" r="8" fill="none" stroke="#DD00BA" stroke-width="3"/>
        <circle cx="444" cy="152" r="3.4"/><circle cx="496" cy="152" r="3.4"/>
        <circle cx="432" cy="186" r="3.4"/><circle cx="508" cy="186" r="3.4"/>
        <circle cx="428" cy="214" r="3.4"/><circle cx="512" cy="214" r="3.4"/>
        <circle cx="458" cy="196" r="3.4"/><circle cx="482" cy="196" r="3.4"/>
        <circle cx="452" cy="234" r="3.4"/><circle cx="488" cy="234" r="3.4"/>
      </g>
      <rect x="432" y="76" width="90" height="16" rx="3" fill="#38BDF8"/>
      <text x="438" y="88" font-size="10.5" font-weight="600" fill="#04263a">pose · 17 kpts</text>
    </g>

    <!-- STAGE 6 : DEPTH -->
    <g opacity="0">
      <rect x="352" y="40" width="506" height="228" fill="url(#depthg)" opacity="0.9"/>
      <use href="#person" fill="#fdf3a0"/>
      <use href="#car" fill="#3d1a63"/>
      <rect x="372" y="56" width="86" height="16" rx="3" fill="#0f172a" opacity="0.85"/>
      <text x="378" y="68" font-size="10.5" font-weight="600" fill="#fff">depth map</text>
      <text x="372" y="196" font-size="10.5" font-weight="700" fill="#0f172a">near</text>
      <text x="812" y="196" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="end">far</text>
    </g>

    <!-- HUD top bar -->
    <circle cx="368" cy="56" r="4" fill="#FF4D4D"></circle>
    <text x="379" y="60" font-size="11" font-weight="700" fill="#e6edf7" letter-spacing="1">LIVE</text>
    <text x="842" y="60" font-size="10.5" font-family="'SFMono-Regular',Consolas,monospace" fill="#8ea3c4" text-anchor="end">YOLO · 42 FPS</text>

    <!-- cycling caption -->
    <g font-size="12" font-weight="600" text-anchor="start">
      <rect x="352" y="244" width="506" height="24" fill="#0b1220" opacity="0.55"/>
      <text x="368" y="260" fill="#ffffff" opacity="1">Object Detection</text>
      <text x="368" y="260" fill="#ffffff" opacity="0">Oriented Bounding Boxes</text>
      <text x="368" y="260" fill="#ffffff" opacity="0">Instance Segmentation</text>
      <text x="368" y="260" fill="#ffffff" opacity="0">Object Tracking</text>
      <text x="368" y="260" fill="#ffffff" opacity="0">Pose Estimation</text>
      <text x="368" y="260" fill="#ffffff" opacity="0">Depth Estimation</text>
    </g>
  </g>
  <rect x="352" y="40" width="506" height="228" rx="14" fill="none" stroke="#c8d3e6"/>

  <!-- ===================== FOOTER : end-to-end delivery ===================== -->
  <line x1="44" y1="288" x2="856" y2="288" stroke="#dbe3ef" stroke-width="1"/>
  <text x="44" y="308" font-size="12.5" font-weight="700" fill="#0f172a">End-to-end delivery, not just demos</text>
  <g font-size="11.5" font-weight="600" fill="#0f172a">
    <g>
      <rect x="300" y="296" width="82" height="22" rx="11" fill="#ffffff" stroke="#dbe3ef"/>
      <circle cx="313" cy="307" r="4" fill="#10B981"></circle>
      <text x="324" y="311">Edge AI</text>
    </g>
    <g>
      <rect x="392" y="296" width="146" height="22" rx="11" fill="#ffffff" stroke="#dbe3ef"/>
      <circle cx="405" cy="307" r="4" fill="#10B981"></circle>
      <text x="416" y="311">Embedded Devices</text>
    </g>
    <g>
      <rect x="548" y="296" width="120" height="22" rx="11" fill="#ffffff" stroke="#dbe3ef"/>
      <circle cx="561" cy="307" r="4" fill="#10B981"></circle>
      <text x="572" y="311">Desktop Apps</text>
    </g>
  </g>
  <text x="856" y="308" font-size="12" font-weight="700" fill="#DD00BA" text-anchor="end">rizwanai.com</text>
</svg>
